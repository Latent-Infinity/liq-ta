[workspace]
resolver = "2"
members = ["crates/liq-ta", "crates/liq-ta-cli", "crates/liq-ta-python"]
# Python crate requires maturin to build properly, exclude from default cargo commands
default-members = ["crates/liq-ta", "crates/liq-ta-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Latent-Infinity/liq-ta"
authors = ["Latent Infinity"]

[workspace.dependencies]
# Core dependencies
num-traits = "0.2"
thiserror = "1.0"
rayon = "1.10"

# CLI dependencies
clap = { version = "4.4", features = ["derive"] }
csv = "1.3"

# Test data generation
rand = "0.8"
rand_chacha = "0.3"
proptest = "1.4"

# Benchmarking
criterion = "0.5.1"

# Serialization (for benchmark output)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3              # Maximum optimizations
lto = "fat"                # Full cross-crate LTO
codegen-units = 1          # Single codegen unit for maximum optimization
panic = "abort"            # Abort on panic (no unwinding overhead)
strip = true               # Strip symbols from binary
