[workspace]
resolver = "2"
members = ["crates/liq-ta", "crates/liq-ta-cli", "crates/liq-ta-python"]
# Python crate requires maturin to build properly, exclude from default cargo commands
default-members = ["crates/liq-ta", "crates/liq-ta-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Latent-Infinity/liq-ta"
authors = ["Latent Infinity"]

[workspace.dependencies]
# Core dependencies
num-traits = "0.2"
thiserror = "1.0"
rayon = "1.10"

# CLI dependencies
clap = { version = "4.4", features = ["derive"] }
csv = "1.3"

# Test data generation
rand = "0.8"
rand_chacha = "0.3"
proptest = "1.4"

# Benchmarking
criterion = "0.5.1"

# Serialization (for benchmark output)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Rust standards v3.6 Section 22 baseline; `allow_attributes` enforces RPS-318's `#[expect]` form.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
needless_collect = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
large_stack_arrays = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
unused_async = "warn"
rc_buffer = "warn"
format_push_string = "warn"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = 3              # Maximum optimizations
lto = "fat"                # Full cross-crate LTO
codegen-units = 1          # Single codegen unit for maximum optimization
# Unwinding stays enabled: the PyO3 extension converts Rust panics into Python
# exceptions instead of aborting the host interpreter (RPS-128, RPS-129).
# Release keeps integer wrap-on-overflow (the Cargo default), chosen explicitly
# because indicator index math is validated up front (RPS-263).
overflow-checks = false
strip = "debuginfo"        # Keep the symbol table for profiling and crash attribution (RPS-255)
