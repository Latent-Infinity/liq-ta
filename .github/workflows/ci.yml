name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Record compiler version
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --features parallel,serde,reference-checks-strict,precision-fast

      - name: Run release-mode tests
        run: cargo test --locked --release --features parallel,serde,precision-fast

      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov@0.9.1

      - name: Line coverage floor (RPS-313)
        run: cargo llvm-cov --locked --features parallel,serde --fail-under-lines 90

      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features

  python-test:
    name: Python Tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Record compiler version
        run: rustc --version --verbose

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: crates/liq-ta-python
        run: |
          uv venv .venv
          uv pip install maturin numpy pytest

      - name: Build and install package
        working-directory: crates/liq-ta-python
        run: uv run maturin develop --locked

      - name: Run Python tests
        working-directory: crates/liq-ta-python
        run: uv run pytest tests/ -v

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      # Written before maturin: on Linux the manylinux container creates a
      # root-owned dist/ that the runner user cannot write into afterwards.
      - name: Record wheel compiler metadata
        shell: bash
        working-directory: crates/liq-ta-python
        run: mkdir -p dist && rustc --version --verbose | tee dist/rustc-version.txt

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.98.1'
          before-script-linux: rustc --version --verbose
          working-directory: crates/liq-ta-python
          args: --locked --release --out dist -i python3.12 -i python3.13 -i python3.14
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/liq-ta-python/dist

  # Dependency advisories, licenses, bans and sources (RPS-296); policy in deny.toml.
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.19.1
      - name: Check dependencies
        run: cargo deny --locked check

  msrv:
    name: Rust 1.95 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Record compiler version
        run: rustc +1.95.0 --version --verbose
      - name: Test minimum supported Rust
        run: cargo +1.95.0 test --locked
      - name: Check Python bindings on minimum supported Rust
        run: cargo +1.95.0 check --locked -p liq-ta-python --all-targets

  # Non-blocking early warning for newer compilers (RPS-006, RPS-013).
  newer-toolchains:
    name: Rust ${{ matrix.toolchain }} (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Record compiler version
        run: rustc +${{ matrix.toolchain }} --version --verbose
      - name: Release-mode tests
        run: cargo +${{ matrix.toolchain }} test --locked --release
