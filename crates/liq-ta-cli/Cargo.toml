[package]
name = "liq-ta-cli"
description = "Command-line interface for liq-ta technical analysis library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "liq_ta_cli"
path = "src/lib.rs"

[[bin]]
name = "liq-ta"
path = "src/main.rs"
doc = false

[dependencies]
liq-ta = { path = "../liq-ta", version = "0.1.1" }
clap = { workspace = true }
csv = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
